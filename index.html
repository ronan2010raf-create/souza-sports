<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14263d">
<meta name="description" content="SOUZA SPORTS — controle de estoque, vendas e encomendas de camisas.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>SOUZA SPORTS</title>
<style>
body{margin:0;padding:24px;font:16px system-ui,sans-serif;background:#f3f5f8;color:#14263d}
#boot{max-width:420px;margin:15vh auto;text-align:center}
</style>
</head>
<body>
<div id="boot">Carregando o SOUZA SPORTS…</div>
<script>
(async()=>{
  const files=["./app-part-1.txt","./app-part-2.txt","./app-part-3.txt","./app-part-4.txt","./app-part-5.txt","./app-part-6.txt","./app-part-7.txt"];
  const parts=await Promise.all(files.map(async file=>{
    const response=await fetch(file);
    if(!response.ok) throw new Error("Não foi possível carregar "+file);
    return response.text();
  }));
  document.open();
  document.write(parts.join(""));
  document.close();
})().catch(error=>{
  document.getElementById("boot").textContent="Erro ao carregar o aplicativo. Verifique sua conexão e atualize a página. "+error.message;
});
</script>
</body>
</html>
